services:
  app:
    build: .
    ports:
      - "8082:8082"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/playgroundposgresql
      SPRING_DATASOURCE_USERNAME: playgroundposgresql
      SPRING_DATASOURCE_PASSWORD: playgroundposgresql

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: playgroundposgresql
      POSTGRES_USER: playgroundposgresql
      POSTGRES_PASSWORD: playgroundposgresql
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: